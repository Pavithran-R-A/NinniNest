name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires Node >= 22.13
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo web export
        run: npx expo export --platform web

      - name: Dependency security report (explicit severities)
        run: |
          echo "::group::Full audit (reported, not blocking)"
          npm audit || true
          echo "::endgroup::"
          # Known-findings policy: the critical shell-quote and the high
          # node-forge/ws advisories are transitively pinned by the `expo`
          # package's own CLI toolchain — not upgradable within SDK 57, and
          # build-time only. The runtime-reachable zod oversized-collection
          # advisory is mitigated in src/models/importPlan.ts (import bounds,
          # see tests/importBounds.test.ts). This step therefore reports
          # severities loudly but does not fail the build; revisit if a
          # direct production dependency gains a fixable critical.
          npm audit --json > audit.json || true
          node -e "
            const j=require('./audit.json');
            const v=j.metadata.vulnerabilities;
            console.log('total vulnerabilities:', JSON.stringify(v));
            for (const [name, a] of Object.entries(j.vulnerabilities)) {
              const via = (a.via||[]).map(x=>typeof x==='string'?x:x.title).join('; ');
              console.log(\`::warning::[\${a.severity}] \${name} (\${a.range}) — \${via}\`);
            }
          "

      - name: Expo dependency compatibility
        run: npx expo-doctor || echo "expo-doctor findings are informational; see job log"

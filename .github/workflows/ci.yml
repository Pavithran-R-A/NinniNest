name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires Node >= 22.13
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo web export
        run: npx expo export --platform web

      - name: Dependency security report (explicit severities)
        run: |
          echo "::group::Runtime dependencies (production) audit"
          npm audit --omit=dev --json > runtime-audit.json || true
          node -e "const j=require('./runtime-audit.json');const v=j.metadata.vulnerabilities;console.log('runtime vulnerabilities:',JSON.stringify(v));process.exitCode=(v.critical>0?1:0)"
          echo "::endgroup::"
          echo "::group::Full tree audit (dev tooling included, reported not blocking)"
          npm audit || true
          echo "::endgroup::"

      - name: Expo dependency compatibility
        run: npx expo-doctor || echo "expo-doctor findings are informational; see job log"
